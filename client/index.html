<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Lärka</title>
    <script>
      // Sätt rätt tema innan appen och CSS:en laddas, så att mörkt läge inte blinkar vitt.
      try {
        // Nycklarna hette rebornlms-* före namnbytet. Behåll temavalet och städa bort det gamla.
        const oldTheme = localStorage.getItem('rebornlms-theme')
        if (oldTheme !== null && localStorage.getItem('larka-theme') === null) {
          localStorage.setItem('larka-theme', oldTheme)
        }
        for (const key of ['rebornlms-theme', 'rebornlms.token', 'rebornlms.expiresAt']) {
          localStorage.removeItem(key)
        }
        const preference = localStorage.getItem('larka-theme')
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle(
          'dark',
          preference === 'dark' || (preference !== 'light' && systemDark),
        )
      } catch {
        // Utan localStorage eller matchMedia används appens standardtema.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
