name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Återanvänds av cd.yml så att main kontrolleras med exakt samma steg innan release.
  workflow_call:

# Nya pushar till en PR avbryter gamla körningar. På main får varje körning gå klart.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Ändrar en PR bara dokumentation (docs/ och *.md) räcker Prettier. backend hoppas över och frontend kör bara
  # Prettier. Ett jobb som hoppas över med if: räknas som godkänt, så de obligatoriska kontrollerna går igenom.
  # paths-ignore på hela workflowen fungerar inte: då rapporterar kontrollerna aldrig och PR:en kan inte mergas.
  changes:
    name: 'Detect changes'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      # På en PR är HEAD merge-commiten och HEAD^1 main, så diffen är PR:ens ändringar. Allt annat (cd.yml,
      # manuell körning) kör alla kontroller.
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
            || git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: 'Backend: build, format, tests'
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Larka.sln

      # dotnet format hoppar tyst över våra egna regler (RLMS*) om analyzern inte är byggd än.
      - name: Build analyzers
        run: dotnet build backend.Analyzers --no-restore

      - name: Check formatting
        run: dotnet format Larka.sln --no-restore --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build Larka.sln --no-restore -warnaserror

      # Builden skriver om client/openapi.json. Skiljer den sig har någon ändrat API:et utan att köra builden.
      - name: Check OpenAPI document is up to date
        working-directory: .
        run: git diff --exit-code client/openapi.json

      # Täckningen samlas med coverlet.runsettings (Cobertura, undantag förklarade i docs/testing.md).
      - name: Test
        run: >
          dotnet test Larka.sln --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory coverage/backend

      - name: Coverage summary
        if: success() && needs.changes.outputs.code == 'true'
        working-directory: .
        run: |
          rate=$(grep -ho '<coverage [^>]*line-rate="[0-9.]*"' coverage/backend/*/coverage.cobertura.xml | head -1 | grep -o 'line-rate="[0-9.]*"' | cut -d'"' -f2)
          echo "Backend: $(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }') % radtäckning" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend/**/coverage.cobertura.xml
          retention-days: 7

  frontend:
    name: 'Frontend: format, lint, build, tests'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # Prettier formaterar allt i repot utom JS, TS och Vue (YAML, JSON, Markdown, CSS, HTML).
      - name: Install root tools
        working-directory: .
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: .
        run: npx prettier --check .

      - name: Install
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      # Typerna genereras från client/openapi.json. Skiljer de sig har någon glömt npm run gen:api.
      - name: Check API types are up to date
        if: needs.changes.outputs.code == 'true'
        run: npm run gen:api && git diff --exit-code src/lib/api-types.ts

      # ESLint kontrollerar både kodfel och formatering (ESLint Stylistic).
      - name: Lint and check formatting
        if: needs.changes.outputs.code == 'true'
        run: npm run lint

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

      # Kör testerna som vanligt och samlar täckning (Cobertura i client/coverage). Ett fallerande test
      # fäller steget precis som npm run test.
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: npm run test:coverage

      - name: Coverage summary
        if: success() && needs.changes.outputs.code == 'true'
        working-directory: .
        run: |
          rate=$(grep -o '<coverage [^>]*line-rate="[0-9.]*"' client/coverage/cobertura-coverage.xml | head -1 | grep -o 'line-rate="[0-9.]*"' | cut -d'"' -f2)
          echo "Frontend: $(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }') % radtäckning" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage
        if: success() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: client/coverage/cobertura-coverage.xml
          retention-days: 7

      # Layoutkontroller i en riktig webbläsare mot det byggda paketet, med API:et mockat. Hör till jobbet
      # `frontend` (ett nytt jobbnamn vore inte ett obligatoriskt statuskrav).
      - name: Install Chromium
        if: needs.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Layout tests (Playwright)
        if: needs.changes.outputs.code == 'true'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: |
            client/layout/playwright-report
            client/layout/test-results
          retention-days: 7

  # Slår ihop backendens och frontendens täckning till en rapport. Inget obligatoriskt statuskrav och ingen
  # tröskel som fäller bygget. Hoppas över när backend eller frontend hoppas över (bara dokumentation).
  coverage:
    name: 'Coverage report'
    needs: [backend, frontend]
    if: needs.backend.result == 'success' && needs.frontend.result == 'success'
    # cd.yml väntar på hela det här workflowet före release. Ett fel i rapporten får inte stoppa en release.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      # Källfilerna behövs för att rapporten ska visa koden rad för rad.
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend

      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: client/coverage

      - name: Install ReportGenerator
        run: dotnet tool restore

      # Sökvägarna i frontendens Cobertura är relativa till client/, därför -sourcedirs.
      - name: Merge reports
        run: >
          dotnet reportgenerator
          "-reports:coverage/backend/**/coverage.cobertura.xml;client/coverage/cobertura-coverage.xml"
          "-targetdir:coverage/report"
          "-sourcedirs:.;client"
          "-reporttypes:Html;MarkdownSummaryGithub;Badges;TextSummary"

      - name: Job summary
        run: |
          echo "## Kodtäckning" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
          retention-days: 14
