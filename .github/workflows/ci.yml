name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Återanvänds av cd.yml så att main kontrolleras med exakt samma steg innan release.
  workflow_call:

# Nya pushar till en PR avbryter gamla körningar. På main får varje körning gå klart.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RebornLMS.sln

      # dotnet format hoppar tyst över våra egna regler (RLMS*) om analyzern inte är byggd än.
      - name: Build analyzers
        run: dotnet build backend.Analyzers --no-restore

      - name: Check formatting
        run: dotnet format RebornLMS.sln --no-restore --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build RebornLMS.sln --no-restore -warnaserror

      - name: Test
        run: dotnet test RebornLMS.sln --no-build

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # Prettier formaterar allt i repot utom JS, TS och Vue (YAML, JSON, Markdown, CSS, HTML).
      - name: Install root tools
        working-directory: .
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: .
        run: npx prettier --check .

      - name: Install
        run: npm ci

      # ESLint kontrollerar både kodfel och formatering (ESLint Stylistic).
      - name: Lint and check formatting
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
