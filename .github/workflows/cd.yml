name: CD

# Körs på varje push till main: checks → release → image → deploy.
# Release sätter versionstagg (vX.Y.Z) och skapar en GitHub-release utifrån commits.
# feat ger minor, fix ger patch och breaking change (! eller BREAKING CHANGE) ger major.
# Image bygger Docker-imagen och pushar den till ghcr.io, deploy säger åt Render att köra den.
on:
  push:
    branches: [main]
    # Bara dokumentation ger ingen release, så det finns inget nytt att bygga eller deploya.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Två merges direkt efter varandra får inte tagga samtidigt.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

# Image-namn i ghcr.io måste vara gemener.
env:
  IMAGE: ghcr.io/eduedugrade/net25-devops-grupp-4

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  # Lägger den sammanslagna täckningsbadgen på den föräldralösa grenen badges (rulesetet för main gäller inte
  # den). Inget annat jobb väntar på det här, så release, image och deploy påverkas inte.
  coverage-badge:
    name: coverage-badge
    needs: checks
    # Saknas rapporten (jobbet coverage får fallera utan att stoppa checks) ska CD-körningen ändå bli grön.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      - name: Commit badge to the badges branch
        run: |
          repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git init -q badge-repo
          cd badge-repo
          git remote add origin "$repo"
          if git fetch -q --depth=1 origin badges; then
            git checkout -q -b badges FETCH_HEAD
          else
            git checkout -q --orphan badges
          fi
          cp ../coverage-report/badge_linecoverage.svg coverage.svg
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "Badgen är oförändrad."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: update coverage badge [skip ci]"
          git push origin badges

  release:
    name: release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.0 om den här commiten släpptes, annars t.ex. v1.2.0-3-gabc1234.
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

  image:
    name: image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Taggas med commit, version och latest. Version och commit bakas in så att /version kan visa dem.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ needs.release.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image ref
        id: ref
        run: echo "image=$IMAGE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: [release, image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Render
        run: .github/scripts/render-deploy.sh
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_JWT_KEY: ${{ secrets.AUTH_JWT_KEY }}
          IMAGE: ${{ needs.image.outputs.image }}
          EXPECTED_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
