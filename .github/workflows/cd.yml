name: CD

# Körs på varje push till main: samma kontroller som på PR:er, sedan release.
# Release sätter versionstagg (vX.Y.Z) och skapar en GitHub-release utifrån commits.
# feat ger minor, fix ger patch och breaking change (! eller BREAKING CHANGE) ger major.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Två merges direkt efter varandra får inte tagga samtidigt.
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.0 om den här commiten släpptes, annars t.ex. v1.2.0-3-gabc1234.
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
