name: E2E

# Tre användarflöden (e2e/tests) mot en färsk stack: Postgres och appen byggd av Dockerfilen, med demodata.
# Testerna skriver data, så de körs aldrig mot produktion. Att deployen fungerar kontrolleras redan av CD (/version).
# Nattligen och på begäran, aldrig på PR:er. En körning bygger hela stacken och tar några minuter.
on:
  schedule:
    # Varje natt 02:23 UTC.
    - cron: '23 2 * * *'
  workflow_dispatch:

# En körning i taget.
concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: 'User journeys against a fresh stack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_APP_PORT: 8080
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Bygger image från Dockerfilen (klienten byggs med) och startar Postgres och appen med demodata.
      - name: Start stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d --build --wait

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Install browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # global-setup väntar också på /health, men ett tydligt fel här är lättare att läsa än en timeout i Playwright.
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -fsS "$E2E_BASE_URL/health" && exit 0
            sleep 2
          done
          docker compose -f e2e/docker-compose.e2e.yml logs app
          exit 1

      - name: Test
        working-directory: e2e
        run: npx playwright test

      - name: App logs
        if: ${{ failure() }}
        run: docker compose -f e2e/docker-compose.e2e.yml logs app

      - name: Stop stack
        if: ${{ always() }}
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

      # Rapporten har video, trace och skärmbilder för varje test (playwright.config.ts), även när allt är grönt.
      - uses: actions/upload-artifact@v4
        id: report
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: How to watch the run
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo '## Se körningen'
            echo
            echo "1. Ladda ner [playwright-report]($REPORT_URL) och packa upp den."
            echo '2. Öppna `index.html` i webbläsaren och klicka på ett test: videon spelas under testet.'
            echo '3. Klicka på _Trace_ för att stega igenom varje klick med skärmbild, DOM och nätverksanrop.'
            echo
            echo 'Traces går också att öppna utan att packa upp rapporten: dra `data/*.zip` till https://trace.playwright.dev.'
          } >> "$GITHUB_STEP_SUMMARY"
